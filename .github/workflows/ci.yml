name: PHP CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
      - name: Lint PHP
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l bot.php && php -l bootstrap.php
      - name: Run native tests
        run: php tests/run.php
